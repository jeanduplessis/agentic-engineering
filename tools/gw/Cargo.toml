[package]
name = "gw"
version = "1.1.0"
edition = "2024"
description = "Personal Git worktree manager"
license = "MIT"
repository = "https://github.com/jeanduplessis/gw"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
path-clean = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = true
codegen-units = 1
strip = true

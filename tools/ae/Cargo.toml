[package]
name = "ae"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Æ — install Agentic Engineering skills and resources into every coding harness"
license = "MIT"
repository = "https://github.com/jeanduplessis/agentic-engineering"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
indicatif = "0.18"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
